apiVersion: v1
kind: Service
metadata:
  name: zookeeper
spec:
  selector:
    app: zookeeper
  ports:
    - protocol: TCP
      port: 2181  # ZooKeeper client port
      targetPort: 2181
      nodePort: 30001  # Exposing on NodePort 30001 (you can access ZooKeeper at localhost:30001)
  type: NodePort
